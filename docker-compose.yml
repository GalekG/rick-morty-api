services:
  api:
    container_name: rm-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    
    networks:
      - rm_network
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
    command: npm run start

  db:
    container_name: rm-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      - rm_network

  redis:
    container_name: rm-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    networks:
      - rm_network

volumes:
  pg_data:
  redis_data:

networks:
  rm_network:
    driver: bridge